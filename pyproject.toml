[project]
name = "connect6-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
game6 = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["connect6", "main.py", "tuning/default.json"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "nbclient>=0.10.2",
]
build = [
    "setuptools>=75",
]

[tool.mypy]
files = ["main.py", "connect6", "tests/test.py", "tuning/harness.py"]
