[project]
name = "connect6-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
game6 = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["defines.py", "game_engine.py", "main.py", "search_engine.py", "tools.py"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pyinstaller>=6.22.3",
]
